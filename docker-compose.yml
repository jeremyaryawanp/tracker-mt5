services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: tradejournal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradejournal-local}
      POSTGRES_DB: tradejournal
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradejournal"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://tradejournal:${POSTGRES_PASSWORD:-tradejournal-local}@db:5432/tradejournal
      # Published on localhost only; set ADMIN_PASSWORD_HASH and change APP_HOST to expose wider.
      APP_HOST: ${APP_HOST:-127.0.0.1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
